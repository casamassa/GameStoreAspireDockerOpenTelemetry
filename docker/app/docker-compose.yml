version: "3.9"

services:
  api:
    build:
      context: ../../GameStore.Api
      dockerfile: Dockerfile
    container_name: gamestore-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__GameStore: Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=apppass
      ConnectionStrings__Redis: redis:6379
    networks:
      - observability
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

networks:
  observability:
    external: true

